syntax = "proto3";

package prometheus;

option go_package = "github.com/mickeyzzc/incus-fleet/internal/prompb;prompb";

message Label {
  string name = 1;
  string value = 2;
}

message Sample {
  double value = 1;
  int64 timestamp = 2;
}

message TimeSeries {
  repeated Label labels = 1;
  repeated Sample samples = 2;
}

message WriteRequest {
  repeated TimeSeries timeseries = 1;
}
