name: Bug report
description: Report a reproducible defect
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. English and Chinese reports are both welcome.
        **Do not include tokens, private keys, real IP addresses, hostnames, or production
        screenshots.** Report security issues privately as described in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "v0.1.0 or a commit hash"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Dashboard / inventory
        - Instances / lifecycle
        - Images / ISO
        - Migrations
        - Terminals / SPICE
        - Asset library / batch
        - API
        - Frontend
        - Documentation
        - Deployment
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Go/Bun versions, database driver, reverse proxy, Incus version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, addresses, hostnames, and instance names.
      render: shell
