name: Feature request
description: Propose a capability or behavior change
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        English and Chinese proposals are both welcome. Describe the problem before the
        solution. For large changes, this issue is the place to agree on the design first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operational problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: impact
    attributes:
      label: Operational impact
      description: Migration behavior, API compatibility, deployment, security, documentation.
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Dashboard / inventory
        - Instances / lifecycle
        - Images / ISO
        - Migrations
        - Terminals / SPICE
        - Asset library / batch
        - API
        - Frontend
        - Documentation
        - Deployment
