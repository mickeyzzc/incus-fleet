[package]
name = "incus-fleet-agent"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Incus Fleet host agent"

[dependencies]
anyhow = "1"
base64 = "0.22"
ed25519-dalek = "2"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
prost = "0.14"
rcgen = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["rt", "macros", "time", "process", "net", "io-util", "sync", "signal"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
x509-parser = "0.18"

[build-dependencies]
prost-build = "0.14"

[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.16"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
