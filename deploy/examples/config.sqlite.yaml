# Example configuration for a SQLite deployment.
# Copy to /home/incus/config.yaml, replace placeholders, and keep mode 0600.
# The admin token is intentionally empty: set INCUS_FLEET_AUTH_TOKEN instead.
server:
  listen: 0.0.0.0:8080
  auth_token: ""
  log_level: info

database:
  driver: sqlite
  dsn: /home/incus/data/fleet.db

# Optional: SSH identity for node network management and adding members.
# The account must have passwordless sudo on every member (see nodesudoers).
# node_access:
#   ssh_user: node-admin
#   ssh_key: /home/incus/.ssh/id_ed25519
#   ssh_port: 22
#   ssh_known_hosts: /home/incus/.ssh/known_hosts
#   ssh_insecure_ignore_host_key: false
#
# Optional: local Incus member name when it differs from the hostname.
# local_member: app-a

clusters:
  - name: c1
    display_name: Primary site
    endpoint: https://192.0.2.10:8443
    project: default
    tls_cert: /home/incus/certs/app-a.crt
    tls_key: /home/incus/certs/app-a.key
    # Optional: verify the Incus server certificate against a private CA.
    # tls_server_cert: /home/incus/certs/incus-server.crt

  - name: c2
    display_name: Secondary site
    endpoint: https://192.0.2.11:8443
    project: default
    tls_cert: /home/incus/certs/app-a.crt
    tls_key: /home/incus/certs/app-a.key
